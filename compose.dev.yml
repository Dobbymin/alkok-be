services:
  alkok-dev-postgres:
    image: postgres:17-alpine
    container_name: alkok-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alkok}
      POSTGRES_USER: ${POSTGRES_USER:-alkok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alkok}
    ports:
      - '5432:5432'
    volumes:
      - alkok_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alkok} -d ${POSTGRES_DB:-alkok}']
      interval: 5s
      timeout: 5s
      retries: 10

  alkok-dev-mailpit:
    image: axllent/mailpit:latest
    container_name: alkok-dev-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  alkok_dev_pgdata:
