services:
  alkok-postgres:
    image: postgres:17-alpine
    container_name: alkok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /home/dobbymin/project/alkok/pgdata:/var/lib/postgresql/data
    networks:
      - alkok-net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  alkok-be:
    image: ghcr.io/${GHCR_OWNER}/alkok-be:${BE_IMAGE_TAG:-latest}
    container_name: alkok-be
    restart: unless-stopped
    depends_on:
      alkok-postgres:
        condition: service_healthy
    env_file:
      - /home/dobbymin/project/alkok/.env
    ports:
      - "127.0.0.1:18102:8080"
    networks:
      - alkok-net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alkok-fe-web:
    image: ghcr.io/${GHCR_OWNER}/alkok-fe-web:${FE_WEB_IMAGE_TAG:-latest}
    container_name: alkok-fe-web
    restart: unless-stopped
    depends_on:
      - alkok-be
    env_file:
      - /home/dobbymin/project/alkok/.env.fe
    ports:
      - "127.0.0.1:18101:3000"
    networks:
      - alkok-net
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alkok-fe-admin:
    image: ghcr.io/${GHCR_OWNER}/alkok-fe-admin:${FE_ADMIN_IMAGE_TAG:-latest}
    container_name: alkok-fe-admin
    restart: unless-stopped
    depends_on:
      - alkok-be
    env_file:
      - /home/dobbymin/project/alkok/.env.fe
    ports:
      - "127.0.0.1:18103:3000"
    networks:
      - alkok-net
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  alkok-net:
    driver: bridge
